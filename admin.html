<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบริหารจัดการหลังบ้าน CMS | เจริญ ออน คัพ</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="style.css">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23004B87'/><text x='50' y='65' fill='white' font-size='40' font-weight='900' text-anchor='middle'>A</text></svg>">
</head>
<body style="background-color: var(--bg-sec); padding-top: 0;">

    <!-- Root container for admin app -->
    <div id="app-main-content" class="admin-layout-container" style="margin-top: 0; min-height: 100vh;">
        <!-- Loading Screen -->
        <div style="display:flex; justify-content:center; align-items:center; height:100vh; flex-direction:column; gap:16px;">
            <div style="width: 50px; height: 50px; border: 4px solid var(--primary); border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite;"></div>
            <span style="font-family:var(--font-family-base); color:var(--text-muted);">กำลังโหลดระบบหลังบ้าน...</span>
        </div>
    </div>

    <!-- Firebase SDK Compat (Required for optional Firebase connection) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js" defer></script>
    <script src="firebase-config.js" defer></script>

    <!-- Core App Scripts -->
    <script src="database.js" defer></script>
    <script src="admin.js" defer></script>
    <script>
        window.onload = () => {
            const adminApp = new CharoenAdmin();
            window.charoenAdminApp = adminApp;
            adminApp.init();
        };
    </script>
</body>
</html>
